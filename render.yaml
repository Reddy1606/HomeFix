# Render Blueprint - triển khai Backend HomeFix
# Cách dùng: Render Dashboard > New > Blueprint > chọn repo GitHub của nhóm.
# Các biến đánh dấu "sync: false" sẽ được Render hỏi nhập tay (KHÔNG ghi key thật vào file này).
services:
  - type: web
    name: homefix-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
